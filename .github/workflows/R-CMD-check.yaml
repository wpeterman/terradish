# Based on the r-lib/actions standard R package check workflow.
name: R CMD check

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: 'true' # Run the extended tests that CRAN skips for check time.
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        # Fail the step, not the whole job, if the check stalls. A step
        # failure lets the upload step below run; a job timeout does not.
        timeout-minutes: 60
        with:
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          upload-results: true

      # check-r-package uploads its results only when the check finishes.
      # When the step is stopped by its timeout, keep the partial example and
      # test output so the stalled example or test can be identified.
      - name: Upload partial check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: partial-check-${{ runner.os }}-r${{ matrix.config.r }}
          path: |
            check/*.Rcheck/00check.log
            check/*.Rcheck/*-Ex*
            check/*.Rcheck/tests/*.Rout*
          if-no-files-found: ignore

      - name: Rebuild full executable vignette sources
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          Rscript -e 'pkgload::load_all("."); for (source in list.files("inst/vignette-source", pattern = "[.]Rmd$", full.names = TRUE)) rmarkdown::render(source, output_dir = tempdir(), quiet = TRUE)'
